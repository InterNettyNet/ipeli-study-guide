<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IPELI">
<title>IPELI 期末試験 攻略ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#1C2333; --muted:#5A6375; --rule:#D8DCE4;
  --blue:#2747B0; --marker:#FFE07A; --ok:#2E7D4F; --bar:#1C2333; --red:#C62828; --redbg:#FDE2E2;
  --serif:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#12161F; --sheet:#181D28; --ink:#E4E8EF; --muted:#9AA3B5; --rule:#2C3442;
        --blue:#8FA8FF; --marker:#5C4D12; --ok:#6FCF97; --bar:#E4E8EF; --red:#FF8A80; --redbg:#4A1C1C;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0; background:var(--paper); color:var(--ink); font:16px/1.85 var(--sans);
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

/* toolbar */
.bar{position:sticky; top:0; z-index:10; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
  padding:.55rem 1rem; background:var(--sheet); border-bottom:1px solid var(--rule)}
.bar .name{font:900 1.05rem/1 var(--serif); margin-right:auto; letter-spacing:.02em}
.bar button{font:700 .85rem/1 var(--sans); color:var(--ink); background:transparent;
  border:1.5px solid var(--rule); border-radius:999px; padding:.55rem .9rem; cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--bar); color:var(--sheet); border-color:var(--bar)}
.bar .count{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
#timer{font-variant-numeric:tabular-nums; min-width:7.5em}
#timer.done{background:#C0392B; color:#fff; border-color:#C0392B}
#tocBtn{display:none}

/* layout */
.wrap{display:grid; grid-template-columns:260px minmax(0,1fr); max-width:1180px; margin:0 auto}
nav.toc{position:sticky; top:52px; align-self:start; max-height:calc(100vh - 52px); overflow:auto;
  padding:1.5rem 1rem 3rem 1.25rem; font-size:.86rem; line-height:1.5}
nav.toc a{display:flex; justify-content:space-between; gap:.5rem; text-decoration:none; color:var(--muted);
  padding:.3rem .5rem; border-left:2px solid transparent}
nav.toc a.h2{color:var(--ink); font-weight:700; margin-top:.8rem}
nav.toc a.h3{padding-left:1.1rem}
nav.toc a.here{border-left-color:var(--blue); color:var(--blue)}
nav.toc .p{font-size:.75rem; color:var(--ok); white-space:nowrap}
main{padding:1.5rem clamp(1rem,4vw,3.5rem) 6rem; max-width:52em}

/* type */
h1,h2,h3{text-wrap:balance}
h1{font:900 clamp(1.9rem,4.5vw,2.8rem)/1.25 var(--serif); margin:1rem 0 .5rem}
h2{font:900 1.65rem/1.35 var(--serif); margin:3.5rem 0 1rem; padding-top:1.25rem; border-top:3px double var(--rule)}
h3{font:600 1.25rem/1.45 var(--serif); margin:2.2rem 0 .6rem}
h4{font-size:1.02rem; margin:2rem 0 .5rem; display:flex; gap:.6rem; align-items:baseline}
p,li{max-width:44em}
blockquote{margin:1rem 0; padding:.6rem 1rem; border-left:3px solid var(--blue); background:var(--sheet); color:var(--ink)}
blockquote p{margin:.4rem 0}
code,pre{font-family:"Cascadia Mono",Consolas,monospace; font-size:.85em}
pre{background:var(--sheet); border:1px solid var(--rule); padding:1rem; overflow:auto; line-height:1.55; border-radius:4px}
hr{display:none}
table{border-collapse:collapse; width:100%; font-size:.9rem; line-height:1.6; display:block; overflow-x:auto; margin:1rem 0}
th,td{border-bottom:1px solid var(--rule); padding:.5rem .6rem; text-align:left; vertical-align:top}
th{font-weight:700; border-bottom:2px solid var(--ink); white-space:nowrap}
li.rights{background:linear-gradient(transparent 55%, var(--marker) 55%); list-style:none; margin-left:-1.1rem}
h5{font-size:1rem; margin:1.6rem 0 .4rem; padding:.35rem .7rem; border-left:4px solid var(--blue); background:var(--sheet)}
p.scene{background:var(--sheet); border:1px solid var(--rule); border-radius:6px; padding:.7rem 1rem; margin:.6rem 0 1rem}
p.rights{border-left:4px solid var(--marker); background:color-mix(in srgb, var(--marker) 22%, transparent); padding:.55rem .9rem; border-radius:0 6px 6px 0}
p.en{font-style:italic; color:var(--muted); border-left:2px dashed var(--rule); padding-left:.9rem}
b{color:var(--blue)}
.answers blockquote{font-style:italic}
del{color:var(--muted)}

/* must-know (赤点回避) */
mark{background:var(--redbg); color:var(--red); font-weight:700; padding:.05em .2em; border-radius:3px;
  -webkit-box-decoration-break:clone; box-decoration-break:clone}
mark strong{color:inherit}
.mustsec{border:2px solid var(--red); border-radius:10px; padding:0 clamp(1rem,3vw,1.75rem) 1rem; margin-top:2.5rem; background:var(--sheet)}
.mustsec h2{border-top:0; color:var(--red); margin-top:1.25rem}
.mustsec strong{color:var(--red)}
#must[aria-pressed="true"]{background:var(--red); border-color:var(--red); color:#fff}
body.must .drill, body.must .nomust, body.must table:not(:has(mark)),
body.must .sec:not(.mustsec):not(.selftest) :is(p, li, tbody tr, blockquote, pre):not(:has(mark)):not(.scene):not(.rights):not(.en),
body.must .selftest p:not(:has(mark)), body.must .selftest p:not(:has(mark)) + details{display:none}

/* redaction: recall mode and drill answers (section 4) */
body.recall .recallable mark, body.recall .recallable strong:not(h4 strong):not(mark strong),
.drill td:nth-child(3), .drill td:nth-child(4){
  background:var(--bar); color:transparent; border-radius:2px; cursor:pointer;
  -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:background .15s, color .15s}
body.recall .recallable mark.shown, body.recall .recallable strong.shown, .drill td.shown, .drill.all td{
  background:transparent; color:inherit; cursor:auto}
.drill td:nth-child(3).shown{font-weight:700}
.drill td a, body.recall .recallable strong a{pointer-events:none}
.tools{display:flex; gap:.5rem; margin:.5rem 0 1rem}
.tools button{font:700 .85rem var(--sans); color:var(--ink); background:var(--sheet);
  border:1.5px solid var(--rule); border-radius:999px; padding:.5rem .9rem; cursor:pointer}

/* checkmarks */
.chk{appearance:none; flex:none; width:1.15rem; height:1.15rem; border:2px solid var(--muted); border-radius:3px;
  margin:0 .5rem 0 0; vertical-align:-.2em; cursor:pointer; position:relative}
.chk:checked{background:var(--ok); border-color:var(--ok)}
.chk:checked::after{content:""; position:absolute; left:.3rem; top:.05rem; width:.3rem; height:.6rem;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}

/* self-test */
.selftest details{margin:.2rem 0 1.4rem; border:1px solid var(--rule); border-radius:4px; background:var(--sheet)}
.selftest summary{cursor:pointer; padding:.5rem .9rem; color:var(--blue); font-weight:700; font-size:.9rem}
.selftest details[open] summary{border-bottom:1px solid var(--rule)}
.selftest details p{margin:.6rem .9rem}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #tocBtn{display:inline-block}
  nav.toc{display:none; position:fixed; inset:52px 0 0 0; max-height:none; background:var(--sheet); z-index:9}
  nav.toc.open{display:block}
}
@media print{.bar,nav.toc,.tools{display:none} .wrap{display:block} body{background:#fff}}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="勉強ツール">
  <span class="name">IPELI 攻略</span>
  <button id="tocBtn" aria-expanded="false">目次</button>
  <button id="must" aria-pressed="false" title="赤い印（赤点回避の必須情報）だけを表示">最低限モード</button>
  <button id="recall" aria-pressed="false" title="太字と赤い印のキーワードを隠す。タップで1つずつ表示">暗記モード</button>
  <button id="timer" title="答案1問ぶんの練習（30分）">30:00 開始</button>
  <span class="count" id="count"></span>
</div>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="目次"></nav>
  <main id="main">
{{BODY}}
  </main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store=JSON.parse(localStorage.getItem('ipeli-done')||'{}');
const save=()=>localStorage.setItem('ipeli-done',JSON.stringify(store));

// checkboxes: §3 questions (h4) and §5 questions
const items=[];
$$('section.answers h4').forEach(h=>items.push([h,h.id||h.textContent.slice(0,40)]));
$$('.selftest p').filter(p=>/^Q\d+\./.test(p.textContent.trim())).forEach(p=>items.push([p,'st-'+p.textContent.trim().match(/^Q\d+/)[0]]));
items.forEach(([el,key])=>{
  const c=document.createElement('input'); c.type='checkbox'; c.className='chk';
  c.setAttribute('aria-label','覚えた'); c.checked=!!store[key];
  c.addEventListener('change',()=>{store[key]=c.checked; save(); progress();});
  el.prepend(c);
});

// table of contents with per-section progress
const toc=$('#toc');
$$('main h2, main h3').forEach(h=>{
  if(!h.id) return;
  const a=document.createElement('a'); a.href='#'+h.id; a.className=h.tagName.toLowerCase();
  a.innerHTML='<span>'+h.textContent+'</span>'; toc.append(a);
  if(h.tagName==='H2'){a.dataset.sec=1; h._link=a;}
  else{h._link=a;}
});
function progress(){
  const all=$$('.chk'), done=all.filter(c=>c.checked).length;
  $('#count').textContent=`覚えた ${done}/${all.length}`;
  $$('section.sec').forEach(s=>{
    const cs=$$('.chk',s), link=$('h2',s)._link; if(!cs.length||!link) return;
    let p=$('.p',link); if(!p){p=document.createElement('span'); p.className='p'; link.append(p);}
    p.textContent=`${cs.filter(c=>c.checked).length}/${cs.length}`;
  });
}
progress();
const heads=$$('main h2[id], main h3[id]');
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){$$('a.here',toc).forEach(a=>a.classList.remove('here')); e.target._link?.classList.add('here');}
}),{rootMargin:'-60px 0px -75% 0px'});
heads.forEach(h=>io.observe(h));
$('#tocBtn').onclick=e=>{const o=toc.classList.toggle('open'); e.target.setAttribute('aria-expanded',o);};
toc.addEventListener('click',e=>{if(e.target.closest('a')){toc.classList.remove('open'); $('#tocBtn').setAttribute('aria-expanded',false);}});

// recall mode + tap to reveal
const rb=$('#recall');
const setRecall=on=>{document.body.classList.toggle('recall',on); rb.setAttribute('aria-pressed',on);
  if(!on) $$('.recallable .shown').forEach(s=>s.classList.remove('shown'));};
rb.onclick=()=>setRecall(rb.getAttribute('aria-pressed')!=='true');
document.addEventListener('click',e=>{
  const s=document.body.classList.contains('recall')&&(e.target.closest('.recallable mark')||e.target.closest('.recallable strong'));
  if(s&&!s.closest('h4')) s.classList.toggle('shown');
  const td=e.target.closest('.drill td'); if(td&&td.cellIndex>=2) td.classList.toggle('shown');
});

// 最低限モード: hide headings whose block has no must-know mark
$$('.sec:not(.mustsec) :is(h3,h4,h5)').forEach(h=>{
  const lv=+h.tagName[1]; let n=h.nextElementSibling, has=false;
  while(n&&!(/^H[2-5]$/.test(n.tagName)&&+n.tagName[1]<=lv)){
    if(n.matches('mark, .rights')||n.querySelector('mark')){has=true;break;} n=n.nextElementSibling;}
  if(!has){h.classList.add('nomust'); h._link?.classList.add('nomust');}
});
const mb=$('#must');
const setMust=on=>{document.body.classList.toggle('must',on); mb.setAttribute('aria-pressed',on); localStorage.setItem('ipeli-must',on?'1':'');};
mb.onclick=()=>setMust(mb.getAttribute('aria-pressed')!=='true');
if(localStorage.getItem('ipeli-must')) setMust(true);

// drill + self-test helper buttons
const drill=$('section.drill');
if(drill){const t=document.createElement('div'); t.className='tools';
  t.innerHTML='<button>答えを全部表示</button><button>全部隠す</button>';
  const [show,hide]=$$('button',t);
  show.onclick=()=>drill.classList.add('all');
  hide.onclick=()=>{drill.classList.remove('all'); $$('td.shown',drill).forEach(td=>td.classList.remove('shown'));};
  $('table',drill).before(t);}
const st=$('section.selftest');
if(st){const t=document.createElement('div'); t.className='tools';
  t.innerHTML='<button>答えを全部開く</button><button>全部閉じる</button>';
  const [o,c]=$$('button',t);
  o.onclick=()=>$$('details',st).forEach(d=>d.open=true);
  c.onclick=()=>$$('details',st).forEach(d=>d.open=false);
  $('h2',st).after(t);}

// 30-minute answer timer
const tb=$('#timer'); let left=1800, tick=null;
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
tb.onclick=()=>{
  if(tb.classList.contains('done')){left=1800; tb.classList.remove('done'); tb.textContent='30:00 開始'; return;}
  if(tick){clearInterval(tick); tick=null; tb.textContent=fmt(left)+' 再開'; return;}
  tick=setInterval(()=>{left--; tb.textContent=fmt(left)+' 一時停止';
    if(left<=0){clearInterval(tick); tick=null; tb.classList.add('done'); tb.textContent='時間です（リセット）';}},1000);
  tb.textContent=fmt(left)+' 一時停止';
};
</script>
</body>
</html>
